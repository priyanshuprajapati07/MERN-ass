<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form for college students">
    <title>Student Registration Form</title>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in the details below to register.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <p>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name"
                        required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
                        placeholder="10-digit phone number" autocomplete="tel"
                        title="Please enter a 10-digit phone number">
                </p>

                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password"
                        placeholder="At least 8 characters" required>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </p>

                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>

                    <label>
                        <input type="radio" name="gender" value="prefer-not-to-say">
                        Prefer not to say
                    </label>
                </fieldset>
            </fieldset>

            <fieldset>
                <legend>Course Information</legend>

                <p>
                    <label for="course">Select Course:</label>
                    <select id="course" name="course" required>
                        <option value="">-- Select a course --</option>
                        <option value="bca-ai">BCA Artificial Intelligence</option>
                        <option value="bca">BCA</option>
                        <option value="btech-cse">B.Tech Computer Science</option>
                        <option value="bsc-it">B.Sc Information Technology</option>
                    </select>
                </p>

                <p>
                    <label for="year">Current Year:</label>
                    <select id="year" name="year" required>
                        <option value="">-- Select year --</option>
                        <option value="first">First Year</option>
                        <option value="second">Second Year</option>
                        <option value="third">Third Year</option>
                        <option value="fourth">Fourth Year</option>
                    </select>
                </p>
            </fieldset>

            <p>
                <label>
                    <input type="checkbox" name="terms" required>
                    I agree to the terms and conditions.
                </label>
            </p>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Form</p>
    </footer>

</body>

</html>
