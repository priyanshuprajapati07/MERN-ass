<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assignment 32: Responsive centred login form using CSS Flexbox.">
    <title>Assignment 32 - Login Form | Priyanshu.dev</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d3557, #5b4bdb);
            font-family: system-ui, Arial, sans-serif;
            padding: 1rem;
            color: #1e293b;
        }

        .login {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .brand {
            text-align: center;
            color: #5b4bdb;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .login h1 {
            margin: 0;
            text-align: center;
            color: #1d3557;
            font-size: 1.8rem;
        }

        .subtitle {
            margin: -.5rem 0 .5rem;
            text-align: center;
            color: #64748b;
            font-size: .95rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: .4rem;
            font-weight: 600;
            font-size: .95rem;
        }

        .field input {
            width: 100%;
            padding: .8rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            font-weight: 400;
        }

        .field input:focus {
            outline: 3px solid #ddd6fe;
            border-color: #5b4bdb;
        }

        .password-wrap {
            display: flex;
            gap: .5rem;
        }

        .password-wrap input {
            min-width: 0;
            flex: 1;
        }

        .show-password {
            padding: 0 .7rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            color: #334155;
            cursor: pointer;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem;
            font-size: .88rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .row a,
        .signup a {
            color: #5b4bdb;
            font-weight: 600;
        }

        .submit-btn {
            padding: .85rem;
            border: 0;
            border-radius: 8px;
            background: #5b4bdb;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }

        .submit-btn:hover {
            background: #4032b4;
        }

        .signup {
            margin: 0;
            text-align: center;
            color: #64748b;
            font-size: .9rem;
        }

        .footer {
            text-align: center;
            color: #e2e8f0;
            font-size: .8rem;
            margin-top: .25rem;
        }

        @media (max-width: 400px) {
            .login {
                padding: 1.4rem;
            }

            .login h1 {
                font-size: 1.55rem;
            }
        }
    </style>
</head>

<body>

    <form class="login" id="loginForm">
        <div class="brand">PRIYANSHU.DEV</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Log in to continue to your account.</p>

        <label class="field" for="email">
            Email Address
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label class="field" for="password">
            Password
            <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8"
                    autocomplete="current-password" required>

                <button class="show-password" type="button" id="togglePassword" aria-label="Show password"
                    aria-pressed="false">
                    Show
                </button>
            </div>
        </label>

        <div class="row">
            <label class="remember">
                <input type="checkbox" name="remember">
                Remember me
            </label>

            <a href="mailto:princek57350@gmail.com?subject=Password%20Help">
                Forgot password?
            </a>
        </div>

        <button class="submit-btn" type="submit">Log In</button>

        <p class="signup">
            Student portfolio project ·
            <a href="https://github.com/priyanshuprajapati07" target="_blank" rel="noopener noreferrer">GitHub</a>
        </p>

        <p class="footer">Assignment 32 | Priyanshu Prajapati</p>
    </form>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "Hide" : "Show";
            togglePassword.setAttribute("aria-pressed", String(isHidden));
            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!loginForm.checkValidity()) {
                loginForm.reportValidity();
                return;
            }

            alert("Form validation successful! This is a demo login form.");
        });
    </script>

</body>

</html>
