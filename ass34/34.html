<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover premium wooden kids study tables, chairs and furniture.">
    <title>Wooden Kids Furniture | Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #35271f;
            background: #fffaf3;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #79543a;
        }

        .links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            align-items: center;
        }

        .links a {
            text-decoration: none;
            color: #35271f;
            font-weight: 500;
        }

        .links a:hover {
            color: #a66b3f;
        }

        .links .cta {
            background: #79543a;
            color: #ffffff;
            padding: 0.65rem 1.1rem;
            border-radius: 6px;
        }

        .links .cta:hover {
            background: #5e402c;
            color: #ffffff;
        }

        #toggle,
        .burger {
            display: none;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2.5rem;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero__text {
            flex: 1;
        }

        .eyebrow {
            color: #a66b3f;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .hero__text h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.15;
            margin-bottom: 1rem;
        }

        .hero__text p {
            color: #6b625c;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            max-width: 45ch;
        }

        .hero__btns {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.85rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn--primary {
            background: #79543a;
            color: #ffffff;
        }

        .btn--primary:hover {
            background: #5e402c;
        }

        .btn--ghost {
            border: 2px solid #79543a;
            color: #79543a;
        }

        .btn--ghost:hover {
            background: #f0e4d8;
        }

        .hero__img {
            flex: 1;
            min-width: 0;
        }

        .hero__img img {
            width: 100%;
            display: block;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 12px 30px rgba(53, 39, 31, 0.12);
        }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .burger {
                display: block;
                font-size: 1.8rem;
                cursor: pointer;
                color: #79543a;
            }

            .links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                background: #ffffff;
                padding: 1.25rem;
                box-shadow: 0 8px 12px rgba(0, 0, 0, 0.08);
                z-index: 10;
            }

            #toggle:checked~.links {
                display: flex;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
                padding: 2rem 1rem;
                gap: 2rem;
            }

            .hero__img {
                width: 100%;
            }

            .hero__btns {
                justify-content: center;
            }

            .hero__text p {
                margin-inline: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="https://woodenkidsfurniture.in/" class="logo" style="text-decoration: none;">
            WOODEN KIDS FURNITURE
        </a>

        <input type="checkbox" id="toggle">

        <label for="toggle" class="burger" aria-label="Toggle navigation menu">
            ☰
        </label>

        <ul class="links">
            <li><a href="https://woodenkidsfurniture.in/">Home</a></li>
            <li><a href="https://woodenkidsfurniture.in/">Products</a></li>
            <li><a href="https://woodenkidsfurniture.in/">About</a></li>
            <li>
                <a class="cta" href="https://woodenkidsfurniture.in/">
                    Explore Collection
                </a>
            </li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header class="hero">

        <div class="hero__text">
            <div class="eyebrow">Made for little learners</div>

            <h1>Give Your Child a Beautiful Space to Learn</h1>

            <p>
                Explore wooden kids study tables, chairs and furniture designed
                to make study time comfortable, organised and enjoyable.
            </p>

            <div class="hero__btns">
                <a class="btn btn--primary" href="https://woodenkidsfurniture.in/">
                    Explore Products
                </a>

                <a class="btn btn--ghost" href="https://woodenkidsfurniture.in/">
                    Discover More
                </a>
            </div>
        </div>

        <div class="hero__img">
            <img src="https://images.unsplash.com/photo-1503919005314-30d93d07d823?auto=format&fit=crop&w=1000&q=80"
                alt="Warm and inviting children's study space">
        </div>

    </header>

</body>

</html>
